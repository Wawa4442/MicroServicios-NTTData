name: Taco Cloud CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Fast unit tests
        working-directory: tacocloud
        run: mvn -pl tacocloud-api,tacocloud-security,tacocloud-messaging-contract test
      - name: Full reactor compile
        working-directory: tacocloud
        run: mvn install -DskipTests
      - name: Integration (needs Docker, Testcontainers starts its own Mongo)
        working-directory: tacocloud
        run: mvn -pl tacocloud-api verify -DskipTests=false
