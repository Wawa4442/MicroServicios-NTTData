# The values given here are actually the default values. But they are explicitly
# set here as an example of setting the Artemis properties.
# Credentials never live in Git (TC-28): they come from the environment.
spring:
  jms:
    template:
      default-destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
  artemis:
    host: ${ARTEMIS_HOST:localhost}
    port: ${ARTEMIS_PORT:61616}
    user: ${ARTEMIS_USER:tacoweb}
    password: ${ARTEMIS_PASSWORD:}
    embedded:
      enabled: false
      
  kafka:
    bootstrap-servers:
    - localhost:9092
    template:
      default-topic: tacocloud.orders.topic
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    producer:
      key-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer    
---
# None of these properties will actually work as configured for this profile.
# But it is left here as an example of configuring for a production profile
# that will override the local configuration in the default profile.
spring:
  profiles: production

  artemis:
    host: ${ARTEMIS_HOST:artemis.tacocloud.com}
    port: ${ARTEMIS_PORT:61617}
    user: ${ARTEMIS_USER:tacoweb}
    password: ${ARTEMIS_PASSWORD:}
---
# Business engine configuration (Laboratorio 3).
# Coupons are data, not code (TC-15): promotions change here without a rebuild.
tacos:
  coupons:
    coupons:
      - code: WELCOME10
        type: PERCENTAGE
        value: 10
        minSubtotal: 10.00
        maxDiscount: 5.00
        activeFrom: 2000-01-01
        activeTo: 2099-12-31
      - code: FLAT5
        type: FIXED
        value: 5.00
        minSubtotal: 20.00
        activeFrom: 2000-01-01
        activeTo: 2099-12-31
  # Taco Physics knob configuration (TC-18). Rule behaviour is data too: the
  # ingredient ids referenced by the fun rules never appear in code.
  physics:
    min-ingredients: 2
    max-ingredients: 12
    ghost-pepper-ingredient-id: GHPR
    drink-ingredient-ids:
      - WATR
    vegan-no-meat-enabled: true
  # Kitchen queue tuning (TC-26): ETA terms and paging, data not code.
  kitchen:
    base-minutes: 5
    per-taco-minutes: 2
    per-ingredient-minutes: 0.5
    per-queued-order-minutes: 1
    default-page-size: 20
    max-page-size: 100
---
# Reliable messaging (TC-28/TC-29/TC-30). The transport is chosen at
# runtime via tacocloud.messaging.transport: noop|jms|rabbit|kafka.
# No broker switch ever needs a rebuild, and no secret lives in Git.
tacocloud:
  messaging:
    transport: ${TACOCLOUD_MESSAGING_TRANSPORT:noop}
    jms:
      destination: ${TACOCLOUD_JMS_DESTINATION:tacocloud.order.queue}
    rabbit:
      destination: ${TACOCLOUD_RABBIT_DESTINATION:tacocloud.order.queue}
    kafka:
      topic: ${TACOCLOUD_KAFKA_TOPIC:tacocloud.orders.topic}
  outbox:
    enabled: true
    batch-size: 20
    poll-interval: 5s
    max-attempts: 8
    base-backoff: 5s
  consumer:
    max-retries: 5
    base-backoff: 2s
    destination: ${TACOCLOUD_CONSUMER_DESTINATION:tacocloud.order.queue}
    dead-letter-destination: ${TACOCLOUD_DLQ_DESTINATION:tacocloud.order.dlq}
  announcements:
    max-active: 20
    max-length: 500
    default-ttl: 7d
  idempotency:
    ttl: 24h
    key-pattern: "[A-Za-z0-9\\-_.:]{8,64}"
---
# Operation and quality (TC-31/TC-32). Correlation travels in logs, metrics
# explain the shop and health stays honest without leaking secrets.
logging:
  pattern:
    level: "%5p [${spring.application.name:api},%X{correlationId:-}]"
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true